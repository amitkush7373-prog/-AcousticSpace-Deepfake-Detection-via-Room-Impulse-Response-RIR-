name: AcousticSpace CI

# Runs on every push/PR: validates both backend and frontend build cleanly.
# This is Week 4's "Construct CI/CD pipelines" deliverable — it doesn't
# deploy anywhere yet (no hosting target chosen), it's the quality gate
# that would sit in front of a real deploy step.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Syntax / import check
        run: python -m py_compile app/*.py

      - name: Generate synthetic test data
        run: python -m app.dataset

      - name: Smoke-test the pipeline end-to-end
        run: |
          python -c "
          from app.audio_pipeline import process_audio_file
          r = process_audio_file('data/synthetic/genuine/genuine_000.wav')
          assert r.duration_seconds > 0
          assert len(r.mel_spectrogram) > 0
          print('backend smoke test passed')
          "

      - name: Build Docker image
        run: docker build -t acousticspace-backend:ci .

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npx tsc -b

      - name: Build
        run: npm run build
